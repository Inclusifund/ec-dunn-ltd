# www -> apex 301 (canonical URL consolidation for SEO + AEO)
server {
    listen 80;
    server_name www.ecdunnltd.co.uk;
    return 301 https://ecdunnltd.co.uk$request_uri;
}

server {
    listen 80 default_server;
    server_name ecdunnltd.co.uk _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/html text/css text/markdown text/plain application/javascript application/json image/svg+xml;

    # Next.js static export assets
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Images — long cache, immutable for hashed filenames
    location /images/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # .md files served as text/markdown for LLM crawler discovery
    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }

    # llms.txt — the AEO manifest at the root
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }

    # Try exact file, then .html extension, then 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
