server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Next.js static export assets
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Images — long cache, immutable for hashed filenames
    location /images/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Try exact file, then .html extension, then 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
